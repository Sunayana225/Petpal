name: CI
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace @petpal/backend -- --runInBand
      - run: npm run test --workspace @petpal/web
      - run: npm run build
      - run: npm run audit:backend
      - run: npm audit --json > artifacts/workspace-audit.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-node-${{ matrix.node }}
          path: artifacts/
  browser-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
